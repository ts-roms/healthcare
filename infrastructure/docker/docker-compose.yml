# Local development dependencies. Not a production deployment.
name: healthcare-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
      POSTGRES_DB: healthcare
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # S3-compatible object storage for documents (console on :9001).
  # MinIO no longer publishes images to Docker Hub; RustFS is an Apache-2.0,
  # S3-compatible replacement. Dev only — the app talks plain S3 (S3_ENDPOINT).
  object-storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: healthcare
      RUSTFS_SECRET_KEY: healthcare-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [object-storage-data:/data]

  # Creates the documents bucket once storage is reachable, then exits.
  object-storage-init:
    image: amazon/aws-cli
    depends_on: [object-storage]
    environment:
      AWS_ACCESS_KEY_ID: healthcare
      AWS_SECRET_ACCESS_KEY: healthcare-dev-secret
      AWS_DEFAULT_REGION: ap-southeast-1
    entrypoint: >
      /bin/sh -c "until aws --endpoint-url http://object-storage:9000 s3api list-buckets > /dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://object-storage:9000 s3api head-bucket --bucket healthcare-documents 2> /dev/null
      || aws --endpoint-url http://object-storage:9000 s3 mb s3://healthcare-documents"

  # Captures outbound email in development (UI on :8025).
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

volumes:
  postgres-data:
  object-storage-data:
