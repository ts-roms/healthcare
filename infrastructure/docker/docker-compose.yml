# Local development dependencies. Not a production deployment.
name: healthcare-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
      POSTGRES_DB: healthcare
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # S3-compatible object storage for documents.
  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: healthcare
      MINIO_ROOT_PASSWORD: healthcare-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 healthcare healthcare-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/healthcare-documents"

  # Captures outbound email in development (UI on :8025).
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

volumes:
  postgres-data:
  minio-data:
