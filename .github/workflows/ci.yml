# CI per CLAUDE.md §32: every pull request runs the affected
# lint → typecheck → unit tests → integration tests → E2E → build pipeline.
# Targets a project does not define are skipped by Nx, so each stage turns on
# automatically as projects add `lint`, `test`, `integration` or `e2e` targets.
name: CI

on:
  pull_request:
#  push:
#    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # nx-set-shas looks up the last successful run on main

env:
  NX_NO_CLOUD: true
  NX_DAEMON: false
  NEXT_TELEMETRY_DISABLED: 1
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PostgreSQL for the API integration tests (apps/api `integration` target) and the E2E journeys (apps/e2e, which
    # create their own `healthcare_e2e` database); Redis for the API's shared rate-limit counters in the integration tests
    # and for its queues during the E2E journeys.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: healthcare
          POSTGRES_PASSWORD: healthcare
          POSTGRES_DB: healthcare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U healthcare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://healthcare:healthcare@localhost:5432/healthcare_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Nx affected needs history to compare against the base

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      # Sets NX_BASE / NX_HEAD: the PR base, or the last green commit on main.
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      # TypeScript project references of the backend projects must be in sync.
      - name: Workspace sync
        run: pnpm exec nx sync:check

      - name: Format
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm exec nx affected -t lint --outputStyle=static

      - name: Typecheck
        run: pnpm exec nx affected -t typecheck --outputStyle=static

      - name: Unit tests
        run: pnpm exec nx affected -t test --outputStyle=static

      - name: Integration tests
        run: pnpm exec nx affected -t integration --outputStyle=static

      # Chromium for the critical-journey tests (apps/e2e); only when the E2E project is affected.
      - name: E2E browser
        run: |
          if pnpm exec nx show projects --affected --with-target e2e --json | grep -q '"e2e"'; then
            pnpm --filter e2e exec playwright install --with-deps chromium
          fi

      - name: E2E tests
        run: pnpm exec nx affected -t e2e --outputStyle=static

      - name: E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm exec nx affected -t build build-storybook --outputStyle=static
