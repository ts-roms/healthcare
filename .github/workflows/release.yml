name: Release

# Creates the GitHub Release for a version tag (vX.Y.Z). Deployment is separate: Railway deploys the `production` branch,
# which is moved to the tag by hand (docs/runbooks/releases.md).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" --verify-tag
