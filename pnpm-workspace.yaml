packages:
  - "apps/*"
  - "libs/*"
  - "tools/kiosk-print-agent"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@scarf/scarf"
  - "@swc/core"
  - "@tailwindcss/oxide"
  - esbuild
  - msgpackr-extract
  - nx
  - sharp
  - unrs-resolver

# Security fixes for transitive dependencies (see `pnpm audit --prod`). Remove an entry once its parent ships the fix.
overrides:
  # @nestjs/platform-socket.io and @socket.io/redis-adapter must share one socket.io copy: two copies give two incompatible
  # `Server` types (and two adapter registries). Keep every dependent on the version the root declares.
  "socket.io": "^4.8.4"
  # @nestjs/swagger 11.4.7 pins js-yaml 5.3.0 (GHSA: merge keys not bounded); 5.4.1+ is patched, same major.
  "@nestjs/swagger>js-yaml": ^5.4.2
  # Fixed releases of transitive packages whose parents have not moved yet (pnpm audit): multer 2.5.0 (request body DoS),
  # body-parser 1.20.9 / 2.4.0, qs 6.16.1.
  "multer@>=2.0.0 <2.5.0": ^2.5.0
  "body-parser@<1.20.9": ^1.20.9
  "body-parser@>=2.0.0 <2.4.0": ^2.4.0
  "qs@<6.16.1": ^6.16.1
  # @storybook/addon-docs takes `react` and `react-dom` as its own dependencies; keep them on the React the web projects use
  # so the pair never splits in libs/ui's Storybook.
  "@storybook/addon-docs>react": ^19.3.0
  "@storybook/addon-docs>react-dom": ^19.3.0
